title: "AI 智能客服系统技术架构图"
subtitle: "Client -> Gateway -> AI Services -> Data"
arrows: true

layers:
  - id: client
    label: "客户端层"
    blocks:
      - type: device
        icon: "Web"
        text: "Web Chat"
        width: 2
      - type: device
        icon: "Mobile"
        text: "Mobile App"
        width: 2
      - type: device
        icon: "Admin"
        text: "企业微信"
        width: 2

  - id: gateway
    label: "接入层"
    blocks:
      - type: module
        text: "API Gateway"
        style: large
      - type: module
        text: "WebSocket\n长连接"
        style: large
      - type: module
        text: "统一鉴权\n(JWT / OAuth)"
        style: large

  - id: ai-services
    label: "AI 服务层"
    blocks:
      - type: group
        title: "AI 引擎集群"
        width: 5
        columns:
          - title: "核心能力"
            items:
              - "NLU 意图识别"
              - "知识检索 RAG"
          - title: "对话引擎"
            items:
              - "大模型调用"
              - "多轮对话管理"
      - type: side-modules
        width: 1
        items:
          - "链路追踪"
          - "服务发现"
          - "限流熔断"

  - id: data
    label: "数据层"
    blocks:
      - type: highlight
        text: "Milvus\n向量数据库"
        width: 2
        color: blue
        style: large
      - type: highlight
        text: "MySQL\n业务数据库"
        width: 2
        color: blue
        style: large
      - type: highlight
        text: "Redis\n缓存"
        width: 2
        color: red
        style: large
      - type: module
        text: "Elasticsearch\n日志检索"
        width: 2
        style: large
